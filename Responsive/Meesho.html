<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Meesho.css">
    <title>MeeshoShopping</title>
</head>

<body>
    <div class="header">
        <div class="nav-1">
            <div class="logo">
                <h1>meesho</h1>
            </div>
            <div class="search-box">
                <div class="searchicon"><i class="fa-solid fa-magnifying-glass"></i></div>
                <label for="text">Try Saree,Kurti or Search by</label>
            </div>
            <div class="ul-1">
                <li>Become a Supplier <span> |</span></li>
                <li>investor Realtions <span>|</span></li>
            </div>
            <div class="profile">
                <i class="fa-solid fa-user"></i>
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <div class="menu-bar"><i class="fa-solid fa-bars"></i></div>
        </div>
        <hr>
        <div class="nav-2">
            <div class="ul-2">
                <li>Women Ethnic</li>
                <li>Women Western</li>
                <li>Men</li>
                <li>Kids</li>
                <li>Home & kitchen</li>
                <li>Beauty & Health</li>
                <li>Jewellery & Accessories</li>
            </div>
        </div>
    </div>
    <div class="text-content">
        <p class="para">Smart Shopping <br> Trusted by Millions</p>
        <button>Shop Now</button>
    </div>
    <div class="background-img">
        <img src="/images/meeshobg.jpg" alt="">
    </div>
</body>

</html>
